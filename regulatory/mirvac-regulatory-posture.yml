    - source: https://www.mirvac.com/privacy-policy
      http_status: 200
      fetched: '2026-10-22'
      quote: >-
        If you consider any personal information we hold about you is inaccurate, out-of-date, incomplete,
        irrelevant or misleading you are entitled to request the correction of your personal information by
        contacting the Mirvac Privacy Officer (refer to contact details below). After receiving a request from
